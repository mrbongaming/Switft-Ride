server:
  port: ${MATCHING_PRICING_SERVICE_PORT:8082}

spring:
  application:
    name: matching_pricing_service
  mongodb:
    uri: ${MATCH_DB_URI:mongodb://localhost:27017/MatchDB}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 500ms
          multiplier: 2
          max-interval: 5s

swiftride:
  messaging:
    consumers-enabled: false # Turn on only after TripAcceptedHandler is implemented.

management:
  endpoints:
    web:
      exposure:
        include: health,info
