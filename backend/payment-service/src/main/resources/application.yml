server:
  port: ${PAYMENT_SERVICE_PORT:8083}

spring:
  application:
    name: payment-service
  datasource:
    url: ${PAY_DB_URL:jdbc:postgresql://localhost:5432/PayDB}
    username: ${PAY_DB_USER}
    password: ${PAY_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${PAY_DDL_AUTO:none}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 500ms
          multiplier: 2
          max-interval: 5s

swiftride:
  messaging:
    consumers-enabled: false # Turn on only after RideCompletedHandler is implemented.

management:
  endpoints:
    web:
      exposure:
        include: health,info
